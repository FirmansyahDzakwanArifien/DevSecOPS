name: DAST - OWASP ZAP Baseline Scan

# Pipeline DAST otomatis: menjalankan OWASP ZAP terhadap aplikasi SnipVault
# setiap kali workflow dijalankan manual, terjadwal mingguan, atau file ini diubah.

on:
  workflow_dispatch:          # jalankan manual dari tab Actions
  schedule:
    - cron: '0 2 * * 1'       # setiap Senin 02:00 UTC
  push:
    branches: [ praktikum/dast-p6 ]
    paths: [ '.github/workflows/dast-zap.yml' ]

permissions:
  contents: read
  issues: write               # izin untuk melaporkan temuan sebagai issue (opsional)

jobs:
  zap_baseline:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://vulnlab.cyphera.my.id'
          cmd_options: '-a'          # sertakan alert bertingkat informational
          fail_action: false         # jangan hentikan pipeline (target lab)
          allow_issue_writing: false # cukup unggah artefak laporan

      - name: Upload ZAP report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: ignore
