name: DAST - OWASP ZAP Baseline Scan

# Pipeline DAST otomatis: menjalankan OWASP ZAP terhadap aplikasi SnipVault
# setiap kali dijalankan manual, terjadwal mingguan, atau file ini diubah.
# Menggunakan image resmi ghcr.io/zaproxy/zaproxy agar bebas dari masalah
# upload-artifact v3 yang sudah di-deprecate pada action bawaan ZAP.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'       # setiap Senin 02:00 UTC
  push:
    branches: [ praktikum/dast-p6 ]
    paths: [ '.github/workflows/dast-zap.yml' ]

permissions:
  contents: read

jobs:
  zap_baseline:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Run OWASP ZAP Baseline Scan
        run: |
          mkdir -p zap-report && chmod 777 zap-report
          docker run --rm -v "${{ github.workspace }}/zap-report:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t https://vulnlab.cyphera.my.id \
              -r report_html.html -w report_md.md -J report_json.json -a \
          || true   # baseline exit code != 0 saat ada temuan; jangan hentikan job (target lab)

      - name: Upload ZAP report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: zap-report/
          if-no-files-found: warn
